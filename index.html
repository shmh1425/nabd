*{box-sizing:border-box} :root{--green:#006858;--ink:#004d40}body{margin:0;background:#edf4f2;color:#373737;font-family:Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e9ab36;outline-offset:5px}.screen{position:relative;isolation:isolate;width:100%;max-width:430px;min-height:100svh;margin:auto;background:white;overflow:hidden;padding:17px 23px 118px}.status{height:37px;background:#f1f6f4;border-radius:25px;display:flex;align-items:center;justify-content:space-between;padding:4px 14px;color:var(--green)}.date{display:flex;align-items:center;gap:8px}.date strong{font-size:15px;font-weight:500}.date small{display:block;font-size:8px}.weather{display:flex;align-items:center;gap:6px;direction:ltr;font-size:16px}.status svg{width:21px;height:24px}.brand{margin:34px auto 20px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);direction:ltr}.brand svg{width:66px;height:61px}.wordmark{border-left:1px solid #73988f;padding-left:8px;text-align:center}.wordmark strong{font-size:37px;line-height:1;display:block}.wordmark span{font-size:15px;letter-spacing:6px;padding-left:5px}.tagline{text-align:center;font-size:17px;margin:24px 0 0}.rule{width:175px;height:4px;background:#087264;border-radius:4px;margin:16px auto 23px}.intro{text-align:center;font-size:14px;line-height:1.55;margin:0 auto 35px;max-width:310px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{position:relative;border-radius:16px;min-height:174px;padding:19px 12px 32px;border:2px solid var(--green);color:var(--green);background:#f2f7f5;text-align:center}.card.primary{color:white;background:linear-gradient(145deg,#006152 15%,#007361 65%,#258a75);border-color:transparent}.card svg{width:51px;height:51px;display:block;margin:0 auto 11px}.card strong{display:block;font-size:15px;margin-bottom:8px}.card p{font-size:13px;line-height:1.5;margin:0}.arrow{position:absolute;bottom:8px;left:10px;border-radius:50%;width:24px;heigh body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif}button{font-family:inherit}.tagline{font-weight:700;font-size:20px}.intro{font-size:16px;line-height:1.7;margin-bottom:26px}.card{padding-bottom:46px;transition:transform .18s,box-shadow .18s}.card strong{font-size:18px}.card p{font-size:14px;line-height:1.6}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00685814}.card:active{transform:translateY(0)}.card .arrow{width:29px;height:29px;left:12px;bottom:10px;display:grid;place-items:center;background:transparent;border:1px solid #00685830;color:var(--green)}.card.primary .arrow{background:#ffffff18;border-color:#ffffff50;color:white}.card .arrow svg{width:18px;height:18px;margin:0;display:block}.languages button{font-size:13px;font-weight:700}.sos-swipe{position:relative;direction:ltr;isolation:isolate;width:252px;max-width:100%;height:58px;margin:18px auto 0;border:1px solid #efdedc;background:#fff8f7;border-radius:36px;box-shadow:0 3px 8px #94372e09;overflow:hidden;--travel:0px}.sos-fill{position:absolute;inset:0 auto 0 0;width:calc(56px + var(--travel));background:#ffe2df;border-radius:36px;pointer-events:none}.sos-copy{position:absolute;inset:0 10px 0 57px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:none;color:#8f3c35;font-size:13px;font-weight:500;transition:opacity .15s}.sos-copy small{font:10px 'Segoe UI',sans-serif;letter-spacing:2px;color:#b17068}.sos-handle{position:absolute;left:5px;top:5px;width:46px;height:46px;padding:12px;border:0;border-radius:50%;color:#fff;background:linear-gradient(145deg,#ff5c59,#d92732);box-shadow:0 2px 6px #c9353540;transform:translateX(var(--travel));touch-action:none;user-select:none;cursor:grab;z-index:2}.sos-handle:active{cursor:grabbing}.sos-handle svg{display:block;width:22px;height:22px}.sos-swipe.dragging .sos-copy{opacity:.3}.sos-swipe.resetting .sos-handle,.sos-swipe.resetting .sos-fill{transition:transform .23s,width .23s}.sos-handle:focus-visible{outline:3px solid #006858;outline-offset:-3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:370px){.tagline{font-size:18px}.intro{font-size:14px}.card strong{font-size:16px}.card p{font-size:13px}.card{min-height:169px}.sos-swipe{height:56px;width:235px}.sos-handle{width:44px;height:44px;padding:11px}.languages button{font-size:12px}.screen{padding-bottom:110px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

<script>
let language='ar';const info=document.querySelector('#info');const messages={ar:{measure:['قياس سريع','هذه واجهة الصفحة الأولى. يتطلب القياس ربط محطة نبض بأجهزة القياس.'],walk:['ابدأ الجولة','ستُضاف خطوات الجولة وقياس المؤشرات قبل النشاط وبعده عند تجهيز الصفحات التالية.'],sos:['المساعدة في الطوارئ','هذا نموذج للواجهة ولم يتم إجراء اتصال. يجب إعداد رقم الطوارئ المناسب للموقع قبل تفعيل هذه الخدمة.'],about:['عن نبض','محطة صحية ذكية لقياس المؤشرات الحيوية ومتابعة الصحة أثناء النشاط اليومي. الوقت ودرجة الحرارة المعروضان قيم توضيحية من التصميم.']},en:{measure:['Quick check','This is the first-page interface. Measurements require a NABD station connected to measurement devices.'],walk:['Start a walk','Walk steps and before-and-after measurements will be added with the next pages.'],sos:['Emergency help','This is an interface prototype. No call has been placed. A local emergency number must be configured before enabling this service.'],about:['About NABD','A smart health station for vital signs and daily activity. The time and temperature are sample values from the design.']}};
document.querySelectorAll('[data-lang]').forEach(button=>button.onclick=()=>{language=button.dataset.lang;document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[language]);document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.toggle('active',el===button);el.setAttribute('aria-pressed',el===button)});});document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{if(button.dataset.action==='walk'){location.href='walk.html?lang='+language;return;}if(button.dataset.action==='about'){location.href='about.html?lang='+language;return;}if(button.dataset.action==='measure'){location.href='verify.html?lang='+language;return;}const [title,text]=messages[language][button.dataset.action];document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-text').textContent=text;info.showModal()});document.querySelector('#close').onclick=()=>info.close();info.onclick=e=>{if(e.target===info)info.close()};
if(new URLSearchParams(location.search).get('lang')==='en')document.querySelector('[data-lang=en]').click();
const track=document.querySelector('#sos-swipe'),handle=document.querySelector('#sos-handle');let drag=null,progress=0;const limit=()=>Math.max(0,track.clientWidth-handle.offsetWidth-10);
function setProgress(value){progress=Math.min(1,Math.max(0,value));track.style.setProperty('--travel',(progress*limit())+'px');handle.setAttribute('aria-valuenow',Math.round(progress*100));handle.setAttribute('aria-label',language==='ar'?'اسحب لطلب الطوارئ':'Slide for emergency help');handle.setAttribute('aria-valuetext',language==='ar'?(progress>=.95?'اترك المقبض أو اضغط Enter للتأكيد':'اسحب إلى اليمين'):(progress>=.95?'Release or press Enter to confirm':'Slide to the right'));}
function resetSwipe(){track.classList.remove('dragging');track.classList.add('resetting');setProgress(0);}
function finishSwipe(){const complete=progress>=.95;resetSwipe();if(complete){const [title,text]=messages[language].sos;document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-text').textContent=text;info.showModal();}}
handle.addEventListener('pointerdown',event=>{if(event.button!==0||drag!==null)return;track.classList.remove('resetting');drag={id:event.pointerId,x:event.clientX,start:progress};handle.setPointerCapture(event.pointerId);track.classList.add('dragging');});
handle.addEventListener('pointermove',event=>{if(drag?.id===event.pointerId)setProgress(drag.start+(event.clientX-drag.x)/Math.max(1,limit()));});
handle.addEventListener('pointerup',event=>{if(drag?.id!==event.pointerId)return;drag=null;handle.releasePointerCapture(event.pointerId);finishSwipe();});
function cancelDrag(){drag=null;resetSwipe();}handle.addEventListener('pointercancel',cancelDrag);handle.addEventListener('lostpointercapture',()=>{if(drag)cancelDrag();});handle.addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','Escape','Enter',' '].includes(event.key))return;event.preventDefault();track.classList.remove('resetting');if(event.key==='ArrowRight')setProgress(progress+.1);else if(event.key==='ArrowLeft')setProgress(progress-.1);else if(event.key==='Home'||event.key==='Escape')cancelDrag();else if(progress>=.95)finishSwipe();});handle.addEventListener('blur',()=>{if(!drag)resetSwipe();});window.addEventListener('resize',cancelDrag);document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',cancelDrag));setProgress(0);
</script><script src="live-status.js"></script></body></html>
