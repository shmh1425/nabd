.fingerprint-control{position:relative;display:block;width:184px;height:184px;margin:44px auto 0;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.fingerprint-control .scanner{width:100%;height:100%;margin:0}.fingerprint-control:focus-visible{outline:3px solid #008c73;outline-offset:7px}.scan-line{position:absolute;top:23%;left:25%;width:50%;height:3px;border-radius:100%;background:#00c996;box-shadow:0 0 14px #00c996;opacity:0;pointer-events:none}.reading .scan-line{opacity:1;animation:sweep 1.2s ease-in-out infinite alternate}.reading .scanner{animation:fingerprint-pulse .8s ease-in-out infinite alternate}.scan-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}.scan-ring circle{fill:none;stroke:#00b78b;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}.scan-success{position:absolute;inset:0;display:none;place-items:center;color:#007e61;font-size:65px;background:#def8eddf;border-radius:50%}.complete .scan-success{display:grid}.demo-caption{font-size:11px;color:#708b82;text-align:center;margin:12px 0 0;line-height:1.6}.waiting{margin:23px 0 26px}.scan-progress{font-size:12px;display:block;min-height:18px;text-align:center;color:#007b65;margin:7px 0 0}.continue span svg{display:block;width:100%;height:100%}@keyframes sweep{from{top:25%}to{top:72%}}@keyframes fingerprint-pulse{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.08);transform:scale(1.025)}}@media(max-width:320px){.fingerprint-control{width:120px;height:120px;margin-top:29px}.fingerprint-control .scanner{width:100%;height:100%}.waiting{margin:16px 0 22px}.demo-caption{font-size:9px}}@media(prefers-reduced-motion:reduce){.reading .scan-line,.reading .scanner{animation:none}.reading .scan-line{top:50%}}
